<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snap &amp; Solve</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">
    <h1>Snap &amp; Solve</h1>
    <p class="subtitle">Upload a picture of your question(s) and get a clean, copyable answer.</p>

    <section class="upload-box" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" hidden />
      <img id="preview" class="preview" hidden />
      <div id="uploadHint">
        <p><strong>Click to choose an image</strong> or drag &amp; drop it here</p>
        <p class="hint-small">JPG, PNG, or WEBP — up to 8MB</p>
      </div>
    </section>

    <button id="solveBtn" disabled>Get Answer</button>

    <div id="status" class="status" hidden></div>

    <section id="resultSection" class="result-section" hidden>
      <div class="result-header">
        <h2>Answer</h2>
        <button id="copyBtn">Copy</button>
      </div>
      <textarea id="answerBox" readonly></textarea>

      <details class="extracted-details">
        <summary>Show extracted question text</summary>
        <textarea id="questionsBox" readonly></textarea>
      </details>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
